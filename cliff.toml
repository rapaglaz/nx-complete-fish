# git-cliff: CHANGELOG.md and the next version from Conventional Commits.
# See https://git-cliff.org/docs/configuration

[changelog]
header = """
# Changelog

All notable changes to this project are listed here. Versions follow [Semantic Versioning](https://semver.org);
while the version is 0.x, a breaking change raises the minor version.
"""
body = """

{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}\
{% if commit.breaking %}**Breaking:** {% endif %}\
{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}\n
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
# The number in each group name only sorts the groups; striptags removes the comment.
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->Features" },
  { message = "^fix", group = "<!-- 1 -->Fixes" },
  { message = "^docs", group = "<!-- 2 -->Documentation" },
  { message = "^refactor", group = "<!-- 3 -->Refactoring" },
  { message = "^chore\\(release\\)", skip = true },
  { message = "^(test|ci|chore)", skip = true },
]

[bump]
initial_tag = "v0.1.0"
features_always_bump_minor = true
# While the version is 0.x, a breaking change raises the minor version; 1.0.0 is set by hand.
breaking_always_bump_major = false
